substitutions:
  name: htram
  friendly_name: HTRAM

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true

logger:
  baud_rate: 115200

api:
  encryption:
    key: !secret api_key
  services:
    - service: beep
      variables:
        freq: int
        dur: int
      then:
        - lambda: |-
            id(htram_core)->send_beep(freq, dur);
            
    - service: set_backlight
      variables:
        brightness: int
      then:
        - lambda: |-
            id(htram_core)->send_backlight(brightness);

    - service: set_leds
      variables:
        r: int
        y: int
        g: int
        brightness: int
      then:
        - lambda: |-
            id(htram_core)->send_leds(r, y, g, brightness);

    - service: enter_bootloader
      then:
        - lambda: |-
            id(htram_core)->send_enter_bootloader();

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:

external_components:
  - source: custom_components

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200

htram_gd32:
  id: htram_core
  uart_id: uart_bus

sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 30s
  - platform: uptime
    name: "Uptime"
  - platform: htram_gd32
    co2:
      name: "CO2"
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
    battery:
      name: "Battery Voltage"

text_sensor:
  - platform: version
    name: "ESPHome Version"

button:
  - platform: template
    name: "Beep"
    icon: "mdi:volume-high"
    on_press:
      - lambda: |-
          id(htram_core)->send_beep(2000, 200);

  - platform: template
    name: "Enter GD32 Bootloader"
    icon: "mdi:cellphone-arrow-down"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(htram_core)->send_enter_bootloader();

number:
  - platform: template
    name: "Screen Brightness"
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    set_action:
      - lambda: |-
          id(htram_core)->send_backlight(x);

  - platform: template
    name: "LED Brightness"
    id: led_brightness
    icon: "mdi:brightness-percent"
    entity_category: config
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 50
    optimistic: true
    set_action:
      - lambda: |-
          id(htram_core)->send_leds(id(led_red).state, id(led_yellow).state, id(led_green).state, x);

switch:
  - platform: template
    name: "LED Red"
    id: led_red
    icon: "mdi:led-on"
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(htram_core)->send_leds(1, id(led_yellow).state, id(led_green).state, id(led_brightness).state);
    turn_off_action:
      - lambda: |-
          id(htram_core)->send_leds(0, id(led_yellow).state, id(led_green).state, id(led_brightness).state);

  - platform: template
    name: "LED Yellow"
    id: led_yellow
    icon: "mdi:led-on"
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(htram_core)->send_leds(id(led_red).state, 1, id(led_green).state, id(led_brightness).state);
    turn_off_action:
      - lambda: |-
          id(htram_core)->send_leds(id(led_red).state, 0, id(led_green).state, id(led_brightness).state);

  - platform: template
    name: "LED Green"
    id: led_green
    icon: "mdi:led-on"
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(htram_core)->send_leds(id(led_red).state, id(led_yellow).state, 1, id(led_brightness).state);
    turn_off_action:
      - lambda: |-
          id(htram_core)->send_leds(id(led_red).state, id(led_yellow).state, 0, id(led_brightness).state);
