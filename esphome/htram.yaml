substitutions:
  name: htram
  friendly_name: HTRAM

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true

logger:
  baud_rate: 115200

api:
  encryption:
    key: !secret api_key
  services:
    - service: beep
      variables:
        freq: int
        dur: int
      then:
        - lambda: |-
            id(htram_core)->send_beep(freq, dur);
            
    - service: set_backlight
      variables:
        brightness: int
      then:
        - lambda: |-
            id(htram_core)->send_backlight(brightness);

    - service: set_leds
      variables:
        r: int
        y: int
        g: int
        brightness: int
      then:
        - lambda: |-
            id(htram_core)->send_leds(r, y, g, brightness);

    - service: enter_bootloader
      then:
        - lambda: |-
            id(htram_core)->send_enter_bootloader();

    - service: play_rtttl
      variables:
        song: string
      then:
        - lambda: |-
            id(htram_core)->play_rtttl(song);

    - service: stop_melody
      then:
        - lambda: |-
            id(htram_core)->send_stop();

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:

web_server:
  port: 80

external_components:
  - source: custom_components

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200

htram_gd32:
  id: htram_core
  uart_id: uart_bus

display:
  - platform: htram_gd32
    id: htram_display
    update_interval: never

font:
  - file: "fonts/NotoSans-Regular.ttf"
    id: font_ukr_14
    size: 14
    glyphsets:
      - GF_Cyrillic_Core

script:
  - id: update_clock_display
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;

          char t_buf[16];
          snprintf(t_buf, sizeof(t_buf), "%02d:%02d", now.hour, now.minute);
          lv_label_set_text(id(ui_clock), t_buf);

          static const char *const UKR_DAYS[] = {"", "Нд", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"};
          static const char *const UKR_MONTHS[] = {
              "", "січня", "лютого", "березня", "квітня", "травня", "червня",
              "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"
          };
          char d_buf[64];
          const char *day_str = (now.day_of_week >= 1 && now.day_of_week <= 7) ? UKR_DAYS[now.day_of_week] : "";
          const char *mon_str = (now.month >= 1 && now.month <= 12) ? UKR_MONTHS[now.month] : "";
          snprintf(d_buf, sizeof(d_buf), "%s, %d %s", day_str, now.day_of_month, mon_str);
          lv_label_set_text(id(ui_date), d_buf);

interval:
  - interval: 1s
    then:
      - lambda: |-
          static int last_min = -1;
          auto now = id(ha_time).now();
          if (now.is_valid() && now.minute != last_min) {
            last_min = now.minute;
            id(update_clock_display).execute();
          }

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: update_clock_display

lvgl:
  displays:
    - htram_display
  rotation: 180
  buffer_size: 12.5%
  byte_order: big_endian
  bg_color: 0x000000
  refresh_interval: 200ms
  widgets:
    - obj:
        width: 240
        height: 240
        pad_all: 0
        border_width: 0
        outline_width: 0
        bg_color: 0x000000
        bg_opa: cover
        scrollable: false
        widgets:
          - label:
              id: ui_clock
              align: top_mid
              y: 26
              text_font: montserrat_20
              text_color: 0xEEEEEE
              text: "--:--"

          - label:
              id: ui_date
              align: top_mid
              y: 50
              text_font: font_ukr_14
              text_color: 0x888888
              text: ""

          - line:
              id: ui_co2_trend
              align: center
              y: 20
              line_width: 2
              line_color: 0x00E676
              line_opa: 50%
              line_rounded: true
              points:
                - [40, 150]
                - [60, 150]
                - [80, 150]
                - [100, 150]
                - [120, 150]
                - [140, 150]
                - [160, 150]
                - [180, 150]
                - [200, 150]

          - label:
              id: ui_co2_val
              align: center
              y: -12
              text_font: montserrat_40
              text_color: 0x00E676
              text: "---"

          - label:
              id: ui_co2_unit
              align: center
              y: 22
              text_font: montserrat_12
              text_color: 0x777777
              text: "PPM  CO2"

          - label:
              id: ui_co2_status
              align: center
              y: 38
              text_font: montserrat_12
              text_color: 0x00E676
              text: "INITIALIZING..."

          - obj:
              align: center
              y: 54
              width: 140
              height: 1
              bg_color: 0x222222
              border_width: 0
              pad_all: 0

          - label:
              id: ui_env
              align: center
              y: 72
              text_font: montserrat_16
              text_color: 0x00E5FF
              text: "--.-°C   --%"

          - label:
              id: ui_batt
              align: bottom_mid
              y: -22
              text_font: montserrat_12
              text_color: 0x888888
              text: "BATTERY"

sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 30s
  - platform: uptime
    name: "Uptime"
  - platform: htram_gd32
    co2:
      name: "CO2"
      id: sensor_co2
      on_value:
        - lvgl.label.update:
            id: ui_co2_val
            text:
              format: "%.0f"
              args: ['x']
        - lambda: |-
            uint16_t ppm = (uint16_t)x;
            uint32_t color = 0x00E676; // Green
            const char* status = "EXCELLENT";
            if (ppm >= 1500) {
              color = 0xFF1744; // Red
              status = "VENTILATE NOW!";
            } else if (ppm >= 1000) {
              color = 0xFFD600; // Yellow
              status = "POOR AIR";
            } else if (ppm >= 800) {
              color = 0xAEEA00; // Lime
              status = "MODERATE";
            }
            lv_obj_set_style_text_color(id(ui_co2_val), lv_color_hex(color), LV_PART_MAIN);
            lv_obj_set_style_line_color(id(ui_co2_trend)->obj, lv_color_hex(color), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(ui_co2_status), lv_color_hex(color), LV_PART_MAIN);
            lv_label_set_text(id(ui_co2_status), status);

            // Update trend line history
            static lv_point_precise_t trend_pts[17];
            static float co2_hist[17] = {0};
            static int hist_count = 0;

            if (hist_count < 17) {
              co2_hist[hist_count++] = x;
            } else {
              for (int i = 0; i < 16; i++) {
                co2_hist[i] = co2_hist[i+1];
              }
              co2_hist[16] = x;
            }

            for (int i = 0; i < hist_count; i++) {
              trend_pts[i].x = 40 + i * 10;
              float val = co2_hist[i];
              if (val < 400.0f) val = 400.0f;
              if (val > 2000.0f) val = 2000.0f;
              trend_pts[i].y = (int32_t)(160 - ((val - 400.0f) / 1600.0f) * 30.0f);
            }
            if (hist_count > 1) {
              lv_line_set_points(id(ui_co2_trend)->obj, trend_pts, hist_count);
            }
    temperature:
      name: "Temperature"
      id: sensor_temp
      on_value:
        - lambda: |-
            char buf[32];
            if (!isnan(id(sensor_temp).state) && !isnan(id(sensor_hum).state)) {
              snprintf(buf, sizeof(buf), "%.1f°C   %.0f%%", id(sensor_temp).state, id(sensor_hum).state);
              lv_label_set_text(id(ui_env), buf);
            }
    humidity:
      name: "Humidity"
      id: sensor_hum
      on_value:
        - lambda: |-
            char buf[32];
            if (!isnan(id(sensor_temp).state) && !isnan(id(sensor_hum).state)) {
              snprintf(buf, sizeof(buf), "%.1f°C   %.0f%%", id(sensor_temp).state, id(sensor_hum).state);
              lv_label_set_text(id(ui_env), buf);
            }
    battery:
      name: "Battery Voltage"
      id: sensor_batt_mv
      on_value:
        - lambda: |-
            char buf[32];
            const char *mode = id(sensor_usb).state ? (id(sensor_chrg).state ? "[CHRG]" : "[USB]") : "";
            snprintf(buf, sizeof(buf), "%.2fV (%.0f%%) %s", id(sensor_batt_mv).state / 1000.0f, id(sensor_batt_level).state, mode);
            lv_label_set_text(id(ui_batt), buf);
    battery_level:
      name: "Battery"
      id: sensor_batt_level

binary_sensor:
  - platform: htram_gd32
    usb:
      name: "USB Power"
      id: sensor_usb
      on_state:
        - lambda: |-
            char buf[32];
            const char *mode = id(sensor_usb).state ? (id(sensor_chrg).state ? "[CHRG]" : "[USB]") : "";
            snprintf(buf, sizeof(buf), "%.2fV (%.0f%%) %s", id(sensor_batt_mv).state / 1000.0f, id(sensor_batt_level).state, mode);
            lv_label_set_text(id(ui_batt), buf);
    charging:
      name: "Charging"
      id: sensor_chrg
      on_state:
        - lambda: |-
            char buf[32];
            const char *mode = id(sensor_usb).state ? (id(sensor_chrg).state ? "[CHRG]" : "[USB]") : "";
            snprintf(buf, sizeof(buf), "%.2fV (%.0f%%) %s", id(sensor_batt_mv).state / 1000.0f, id(sensor_batt_level).state, mode);
            lv_label_set_text(id(ui_batt), buf);
    button:
      name: "Button"
      id: htram_button

text_sensor:
  - platform: version
    name: "ESPHome Version"
  - platform: htram_gd32
    firmware_version:
      name: "GD32 Firmware"
      entity_category: diagnostic
    button_action:
      name: "Button Action"

button:
  - platform: template
    name: "Beep"
    icon: "mdi:volume-high"
    on_press:
      - lambda: |-
          id(htram_core)->send_beep(2000, 200);

  - platform: template
    name: "Enter GD32 Bootloader"
    icon: "mdi:cellphone-arrow-down"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(htram_core)->send_enter_bootloader();

number:
  - platform: template
    name: "Screen Brightness"
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    set_action:
      - lambda: |-
          id(htram_core)->send_backlight(x);

switch:
  # LED state is authoritative on the GD32 (it lights green at boot and mirrors
  # its real state back over telemetry); DISABLED restore keeps the ESP from
  # overriding it on connect.
  - platform: htram_gd32
    red:
      name: "LED Red"
      icon: "mdi:led-on"
      restore_mode: DISABLED
    yellow:
      name: "LED Yellow"
      icon: "mdi:led-on"
      restore_mode: DISABLED
    green:
      name: "LED Green"
      icon: "mdi:led-on"
      restore_mode: DISABLED
