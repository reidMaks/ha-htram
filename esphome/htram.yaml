substitutions:
  name: htram
  friendly_name: HTRAM

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true

logger:
  baud_rate: 115200

api:
  encryption:
    key: !secret api_key
  services:
    - service: beep
      variables:
        freq: int
        dur: int
      then:
        - lambda: |-
            id(htram_core)->send_beep(freq, dur);
            
    - service: set_backlight
      variables:
        brightness: int
      then:
        - lambda: |-
            id(htram_core)->send_backlight(brightness);

    - service: set_leds
      variables:
        r: int
        y: int
        g: int
        brightness: int
      then:
        - lambda: |-
            id(htram_core)->send_leds(r, y, g, brightness);

    - service: enter_bootloader
      then:
        - lambda: |-
            id(htram_core)->send_enter_bootloader();

    - service: play_rtttl
      variables:
        song: string
      then:
        - lambda: |-
            id(htram_core)->play_rtttl(song);

    - service: play_anthem
      then:
        - lambda: |-
            id(htram_core)->play_anthem();

    - service: stop_melody
      then:
        - lambda: |-
            id(htram_core)->send_stop();

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:

web_server:
  port: 80

external_components:
  - source: custom_components

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200

htram_gd32:
  id: htram_core
  uart_id: uart_bus

sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 30s
  - platform: uptime
    name: "Uptime"
  - platform: htram_gd32
    co2:
      name: "CO2"
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
    battery:
      name: "Battery Voltage"
    battery_level:
      name: "Battery"

binary_sensor:
  - platform: htram_gd32
    usb:
      name: "USB Power"
    charging:
      name: "Charging"

text_sensor:
  - platform: version
    name: "ESPHome Version"
  - platform: htram_gd32
    firmware_version:
      name: "GD32 Firmware"
      entity_category: diagnostic

button:
  - platform: template
    name: "Beep"
    icon: "mdi:volume-high"
    on_press:
      - lambda: |-
          id(htram_core)->send_beep(2000, 200);

  - platform: template
    name: "Enter GD32 Bootloader"
    icon: "mdi:cellphone-arrow-down"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(htram_core)->send_enter_bootloader();

number:
  - platform: template
    name: "Screen Brightness"
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    set_action:
      - lambda: |-
          id(htram_core)->send_backlight(x);

switch:
  # LED state is authoritative on the GD32 (it lights green at boot and mirrors
  # its real state back over telemetry); DISABLED restore keeps the ESP from
  # overriding it on connect.
  - platform: htram_gd32
    red:
      name: "LED Red"
      icon: "mdi:led-on"
      restore_mode: DISABLED
    yellow:
      name: "LED Yellow"
      icon: "mdi:led-on"
      restore_mode: DISABLED
    green:
      name: "LED Green"
      icon: "mdi:led-on"
      restore_mode: DISABLED
