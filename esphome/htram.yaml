substitutions:
  name: htram
  friendly_name: HTRAM
  # Home Assistant weather entity the outdoor slot reads from.
  weather_entity: weather.forecast_home

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Several of these are going to live in the same house, and they are all
  # flashed from this one config. The MAC suffix keeps their hostnames and
  # entity ids apart without a per-device file. Drop this line to go back to a
  # plain "htram".
  name_add_mac_suffix: true
  on_boot:
    - text_sensor.template.publish:
        id: device_id
        state: !lambda "return esphome::get_mac_address().substr(6);"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true

logger:
  baud_rate: 115200

api:
  encryption:
    key: !secret api_key
  services:
    - service: beep
      variables:
        freq: int
        dur: int
      then:
        - lambda: |-
            id(htram_core)->send_beep(freq, dur);
            
    - service: set_backlight
      variables:
        brightness: int
      then:
        - lambda: |-
            id(htram_core)->send_backlight(brightness);

    - service: set_leds
      variables:
        r: int
        y: int
        g: int
        brightness: int
      then:
        - lambda: |-
            id(htram_core)->send_leds(r, y, g, brightness);

    - service: enter_bootloader
      then:
        - lambda: |-
            id(htram_core)->send_enter_bootloader();

    - service: play_rtttl
      variables:
        song: string
      then:
        - lambda: |-
            id(htram_core)->play_rtttl(song);

    - service: stop_melody
      then:
        - lambda: |-
            id(htram_core)->send_stop();

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:

web_server:
  port: 80

external_components:
  - source: custom_components

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  # 921600 since the GD32 stopped blocking its main loop for longer than the
  # 2 KB RX ring can absorb (SHT30 split in two, CO2 poll behind flow control).
  # The resident flasher inherits USART1_BAUD from the firmware, so GD32 OTA
  # runs at this speed too.
  baud_rate: 921600

htram_gd32:
  id: htram_core
  uart_id: uart_bus

display:
  - platform: htram_gd32
    id: htram_display
    update_interval: never

font:
  # Digits only, and pre-slanted: ESPHome renders from the TTF at build time and
  # LVGL has no shear, so the 12 deg oblique is baked into the file by
  # tools/fonts/make_oblique.py. 4 bpp matters here — the ExtraLight stem is
  # 5 px wide and 1 bpp would shred it.
  - file: "fonts/DejaVuSans-ExtraLight-Oblique.ttf"
    id: font_clock
    size: 92
    bpp: 4
    glyphs: "0123456789-"

  # Sixteen glyphs, for the one thing that is read deliberately rather than
  # glanced at: the device id, shown big enough to read across a desk.
  - file: "fonts/NotoSans-Regular.ttf"
    id: font_id
    size: 44
    bpp: 4
    glyphs: "0123456789abcdef"

  # The caption line stays upright, and in a regular weight: measured at 15 px,
  # ExtraLight has a 1 px stem that never reaches full white (peak 240/255),
  # while Noto Sans gets 2 px at 255. Going bigger does not fix it -- ExtraLight
  # is still 1 px at 17 px -- so this is about weight, not size.
  - file: "fonts/NotoSans-Regular.ttf"
    id: font_slot
    size: 15
    bpp: 4
    glyphs: "0123456789.,:%-+ °"
    glyphsets:
      - GF_Cyrillic_Core

globals:
  - id: ha_link
    type: bool
    restore_value: false
    initial_value: "false"
  - id: slot_idx
    type: int
    restore_value: false
    initial_value: "0"
  - id: slot_hold
    type: bool
    restore_value: false
    initial_value: "false"
  - id: led_auto
    type: bool
    restore_value: true
    initial_value: "true"

script:
  # Hours and minutes are separate labels: only the minutes row is dirty most of
  # the time, and staggering them needs independent x offsets anyway.
  - id: refresh_clock
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          // lv_label_set_text invalidates unconditionally, so each digit is
          // written only when it actually changed.
          static int prev[4] = {-1, -1, -1, -1};
          const int cur[4] = {now.hour / 10, now.hour % 10,
                              now.minute / 10, now.minute % 10};
          lv_obj_t *const lbl[4] = {id(ui_h1), id(ui_h2), id(ui_m1), id(ui_m2)};
          char buf[2] = {0, 0};
          for (int i = 0; i < 4; i++) {
            if (cur[i] == prev[i]) continue;
            prev[i] = cur[i];
            buf[0] = '0' + cur[i];
            lv_label_set_text(lbl[i], buf);
          }

  # One caption line, three facts, rotating every 7 s.
  # Which unit am I looking at? Triple-click and the caption says so for a few
  # seconds, then goes back to its rotation. Nothing permanent is added to the
  # face for something you need about twice a year.
  - id: show_device_id
    mode: restart
    then:
      - lambda: |-
          /* Identifying a unit is a deliberate act, not a glance, so it takes
             over the whole face rather than whispering from the caption line
             at 1.7 mm. The clock comes back six seconds later. */
          id(slot_hold) = true;
          std::string s = esphome::get_mac_address().substr(6);
          lv_label_set_text(id(ui_devid), s.c_str());
          lv_obj_t *const hide[] = {id(ui_h1), id(ui_h2), id(ui_m1), id(ui_m2),
                                    id(ui_slot), id(ui_pocket)};
          for (auto *o : hide) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_devid), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_devid_cap), LV_OBJ_FLAG_HIDDEN);
      - delay: 6s
      - lambda: |-
          lv_obj_add_flag(id(ui_devid), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(ui_devid_cap), LV_OBJ_FLAG_HIDDEN);
          lv_obj_t *const show[] = {id(ui_h1), id(ui_h2), id(ui_m1), id(ui_m2),
                                    id(ui_slot), id(ui_pocket)};
          for (auto *o : show) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
          id(slot_hold) = false;
      - script.execute: refresh_clock
      - script.execute: refresh_slot
      - script.execute: refresh_pocket

  - id: refresh_slot
    then:
      - lambda: |-
          if (id(slot_hold)) return;
          char buf[48];
          switch (id(slot_idx)) {
            case 0: {
              auto now = id(ha_time).now();
              if (!now.is_valid()) return;
              static const char *const DAYS[] = {"", "Нд", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"};
              // Three letters, not the full month: "Пн, 22 листопада" is 138 px
              // and the content circle only offers 117 px at this baseline.
              static const char *const MONTHS[] = {
                  "", "січ", "лют", "бер", "кві", "тра", "чер",
                  "лип", "сер", "вер", "жов", "лис", "гру"};
              snprintf(buf, sizeof(buf), "%s, %d %s",
                       DAYS[now.day_of_week >= 1 && now.day_of_week <= 7 ? now.day_of_week : 0],
                       now.day_of_month,
                       MONTHS[now.month >= 1 && now.month <= 12 ? now.month : 0]);
              break;
            }
            case 1: {
              if (isnan(id(outdoor_temp).state)) { snprintf(buf, sizeof(buf), "--° надворі"); break; }
              // The condition replaces the last word rather than adding a glyph:
              // a 1.8 mm pictogram is ambiguous where a 1.2 mm word is not.
              std::string w = id(outdoor_cond).state;
              const char *word = "надворі";
              if (w == "rainy" || w == "pouring" || w == "lightning-rainy" || w == "hail") word = "дощ";
              else if (w == "snowy" || w == "snowy-rainy") word = "сніг";
              else if (w == "windy" || w == "windy-variant") word = "вітер";
              snprintf(buf, sizeof(buf), "%.0f° %s", id(outdoor_temp).state, word);
              break;
            }
            default: {
              if (isnan(id(sensor_temp).state) || isnan(id(sensor_hum).state)) return;
              snprintf(buf, sizeof(buf), "%.1f°  %.0f%%",
                       id(sensor_temp).state, id(sensor_hum).state);
              break;
            }
          }
          lv_label_set_text(id(ui_slot), buf);

  # The pocket is empty whenever nothing needs the eye. Percentage rather than a
  # battery glyph: at 1.8 mm a glyph is mush and "62%" is not.
  - id: refresh_pocket
    then:
      - lambda: |-
          // Charge level and API link are independent facts, so they no longer
          // gate each other: coupling them meant every gap between API clients
          // (an `esphome logs` session ending counts) hid the battery.
          const bool warn = !id(ha_link);
          const bool on_batt = !id(sensor_usb).state &&
                               !isnan(id(sensor_batt_level).state);

          ESP_LOGD("pocket", "link=%d usb=%d batt=%.0f -> warn=%d batt_icon=%d",
                   (int) id(ha_link), (int) id(sensor_usb).state,
                   id(sensor_batt_level).state, (int) warn, (int) on_batt);

          lv_label_set_text(id(ui_pocket), warn ? "!" : "");

          lv_obj_t *const batt[3] = {id(ui_batt_body), id(ui_batt_nub), id(ui_batt_fill)};
          for (int i = 0; i < 3; i++) {
            if (on_batt)
              lv_obj_remove_flag(batt[i], LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_add_flag(batt[i], LV_OBJ_FLAG_HIDDEN);
          }
          if (!on_batt) return;

          const float pct = id(sensor_batt_level).state;
          const uint32_t c = pct < 20 ? 0xFF9E3D : 0x9AA2AC;
          int w = (int) lroundf(18.0f * (pct < 0 ? 0 : (pct > 100 ? 100 : pct)) / 100.0f);
          if (w < 1) w = 1;
          lv_obj_set_width(id(ui_batt_fill), w);
          lv_obj_set_style_bg_color(id(ui_batt_fill), lv_color_hex(c), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(ui_batt_nub), lv_color_hex(c), LV_PART_MAIN);
          lv_obj_set_style_border_color(id(ui_batt_body), lv_color_hex(c), LV_PART_MAIN);

  # CO2 moved off the screen and onto the LEDs above it, so they have to
  # actually track it now.
  - id: refresh_leds
    then:
      - lambda: |-
          if (!id(led_auto) || isnan(id(sensor_co2).state)) return;
          uint16_t ppm = (uint16_t) id(sensor_co2).state;
          id(htram_core)->send_leds(ppm >= 1500, ppm >= 1000 && ppm < 1500, ppm < 1000, 0);

interval:
  - interval: 1s
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          // Moving the dot invalidates only where it was and where it lands.
          float a = (now.second * 6.0f - 90.0f) * 3.14159265f / 180.0f;
          lv_obj_set_pos(id(ui_secdot),
                         (lv_coord_t) lroundf(120.0f + 113.0f * cosf(a) - 3.5f),
                         (lv_coord_t) lroundf(120.0f + 113.0f * sinf(a) - 3.5f));
          static int last_min = -1;
          if (now.minute != last_min) {
            last_min = now.minute;
            id(refresh_clock).execute();
            if (id(slot_idx) == 0) id(refresh_slot).execute();
          }

  - interval: 7s
    then:
      - lambda: id(slot_idx) = (id(slot_idx) + 1) % 3;
      - script.execute: refresh_slot

  # Polled, not edge-tracked: on_client_disconnected fires whenever any client
  # leaves, so a passing `esphome logs` session used to latch the warning on.
  - interval: 5s
    then:
      - if:
          condition: api.connected
          then:
            - lambda: |-
                if (!id(ha_link)) { id(ha_link) = true; id(refresh_pocket).execute(); }
          else:
            - lambda: |-
                if (id(ha_link)) { id(ha_link) = false; id(refresh_pocket).execute(); }

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: refresh_clock
        - script.execute: refresh_slot

lvgl:
  displays:
    - htram_display
  rotation: 180
  buffer_size: 12.5%
  byte_order: big_endian
  bg_color: 0x000000
  refresh_interval: 200ms
  widgets:
    - obj:
        width: 240
        height: 240
        pad_all: 0
        border_width: 0
        outline_width: 0
        bg_color: 0x000000
        bg_opa: cover
        scrollable: false
        widgets:
          # A swept arc looked right but cost 8.9 s of UART once a minute: at the
          # 59->0 wrap LVGL invalidates the whole 214x214 ring at once, and at
          # 115200 that is a two-thirds-of-a-screen repaint. Measured on the
          # device as "lvgl took a long time for an operation (8853 ms)".
          #
          # So the ring is now a static outline that is drawn once and never
          # touched, and the seconds are a dot orbiting it. The wrap becomes
          # just another 7 px move, and the whole thing costs ~40 ms/s.
          - obj:
              id: ui_ring
              align: center
              width: 228
              height: 228
              radius: 114
              bg_opa: TRANSP
              border_width: 2
              border_color: 0xB9AFA3
              border_opa: 30%
              pad_all: 0
              scrollable: false
              clickable: false

          - obj:
              id: ui_secdot
              x: 116
              y: 3
              width: 7
              height: 7
              radius: 4
              bg_color: 0xB9AFA3
              bg_opa: cover
              border_width: 0
              pad_all: 0
              scrollable: false
              clickable: false

          # Staggered +/-16 px. The clock face carries tight vertical metrics
          # (ascender clamped to the digits), so the line box is 67 px rather
          # than 102 and y addresses the ink directly — which also stops the two
          # rows overlapping, so LVGL no longer merges them into one repaint.
          # One label per digit. Only the digit that actually changed is
          # invalidated, so nine minutes out of ten the repaint is a single
          # 59x70 box instead of the whole 118 px pair.
          #
          # 92 px is the ceiling while the date stays inside the ring: the
          # hours row needs 82 px of half-width (pair + stagger + the oblique's
          # overhang) and the circle only offers that from y=44 down.
          - label:
              id: ui_h1
              align: top_mid
              x: -46
              y: 44
              text_font: font_clock
              text_color: 0xF0EAE0
              text: "-"
          - label:
              id: ui_h2
              align: top_mid
              x: 14
              y: 44
              text_font: font_clock
              text_color: 0xF0EAE0
              text: "-"
          - label:
              id: ui_m1
              align: top_mid
              x: -14
              y: 120
              text_font: font_clock
              text_color: 0xF0EAE0
              text: "-"
          - label:
              id: ui_m2
              align: top_mid
              x: 46
              y: 120
              text_font: font_clock
              text_color: 0xF0EAE0
              text: "-"

          - label:
              id: ui_devid
              align: center
              y: 4
              text_font: font_id
              text_color: 0xF0EAE0
              text: ""
              hidden: true

          - label:
              id: ui_devid_cap
              align: center
              y: -34
              text_font: font_slot
              text_color: 0x707880
              text: "ID"
              hidden: true

          - label:
              id: ui_slot
              align: bottom_mid
              y: -25
              text_font: font_slot
              text_color: 0xC2C8D0
              text: ""

          - label:
              id: ui_pocket
              align: top_right
              x: -64
              y: 70
              text_font: font_slot
              text_color: 0xFF9E3D
              text: ""

          # Battery, drawn rather than written. Sits in the pocket the stagger
          # of the hours leaves free, and stays hidden while on USB.
          - obj:
              id: ui_batt_body
              x: 166
              y: 54
              width: 22
              height: 11
              radius: 2
              bg_opa: TRANSP
              border_width: 1
              border_color: 0x707880
              pad_all: 0
              scrollable: false
              clickable: false
              hidden: true
          - obj:
              id: ui_batt_nub
              x: 188
              y: 57
              width: 2
              height: 5
              radius: 0
              bg_color: 0x707880
              bg_opa: cover
              border_width: 0
              pad_all: 0
              scrollable: false
              clickable: false
              hidden: true
          - obj:
              id: ui_batt_fill
              x: 168
              y: 56
              width: 12
              height: 7
              radius: 0
              bg_color: 0x707880
              bg_opa: cover
              border_width: 0
              pad_all: 0
              scrollable: false
              clickable: false
              hidden: true

sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 30s
  - platform: uptime
    name: "Uptime"

  # Outdoor temperature for the middle slot position — the one thing the smart
  # home adds that the device could never know by itself.
  - platform: homeassistant
    id: outdoor_temp
    entity_id: ${weather_entity}
    attribute: temperature
    on_value:
      - lambda: if (id(slot_idx) == 1) id(refresh_slot).execute();

  - platform: htram_gd32
    co2:
      name: "CO2"
      id: sensor_co2
      on_value:
        - script.execute: refresh_leds
    temperature:
      name: "Temperature"
      id: sensor_temp
      on_value:
        - lambda: if (id(slot_idx) == 2) id(refresh_slot).execute();
    humidity:
      name: "Humidity"
      id: sensor_hum
      on_value:
        - lambda: if (id(slot_idx) == 2) id(refresh_slot).execute();
    battery:
      name: "Battery Voltage"
      id: sensor_batt_mv
    battery_level:
      name: "Battery"
      id: sensor_batt_level
      on_value:
        - script.execute: refresh_pocket

binary_sensor:
  - platform: htram_gd32
    usb:
      name: "USB Power"
      id: sensor_usb
      on_state:
        - script.execute: refresh_pocket
    charging:
      name: "Charging"
      id: sensor_chrg
    button:
      name: "Button"
      id: htram_button

text_sensor:
  - platform: version
    name: "ESPHome Version"
  - platform: template
    id: device_id
    name: "Device ID"
    icon: "mdi:identifier"
    entity_category: diagnostic
  - platform: homeassistant
    id: outdoor_cond
    entity_id: ${weather_entity}
    on_value:
      - lambda: if (id(slot_idx) == 1) id(refresh_slot).execute();
  - platform: htram_gd32
    firmware_version:
      name: "GD32 Firmware"
      entity_category: diagnostic
    button_action:
      name: "Button Action"
      on_value:
        - if:
            condition:
              lambda: return x == "triple";
            then:
              - script.execute: show_device_id

button:
  - platform: template
    name: "Show Device ID"
    icon: "mdi:identifier"
    entity_category: diagnostic
    on_press:
      - script.execute: show_device_id

  - platform: template
    name: "Beep"
    icon: "mdi:volume-high"
    on_press:
      - lambda: |-
          id(htram_core)->send_beep(2000, 200);

number:
  - platform: template
    name: "Screen Brightness"
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    set_action:
      - lambda: |-
          id(htram_core)->send_backlight(x);

switch:
  # LED state is authoritative on the GD32 (it lights green at boot and mirrors
  # its real state back over telemetry); DISABLED restore keeps the ESP from
  # overriding it on connect.
  - platform: htram_gd32
    red:
      name: "LED Red"
      icon: "mdi:led-on"
      restore_mode: DISABLED
    yellow:
      name: "LED Yellow"
      icon: "mdi:led-on"
      restore_mode: DISABLED
    green:
      name: "LED Green"
      icon: "mdi:led-on"
      restore_mode: DISABLED

  - platform: template
    name: "LED Auto"
    icon: "mdi:television-ambient-light"
    lambda: return id(led_auto);
    turn_on_action:
      - lambda: id(led_auto) = true;
      - script.execute: refresh_leds
    turn_off_action:
      - lambda: id(led_auto) = false;
    restore_mode: RESTORE_DEFAULT_ON
