configure_device:
  name: Provision device
  description: >-
    Send WiFi credentials, and optionally an MQTT endpoint, to the monitor over
    Bluetooth. The device must be reachable: press its button first if it has
    been disconnected for a while, since it only advertises in short windows.
    The Bluetooth link is dropped at the end, which is when the device joins
    the network.
  fields:
    device_id:
      name: Device
      description: Which monitor to provision.
      required: true
      selector:
        device:
          integration: htram
    ssid:
      name: WiFi network
      description: Name of the network to join. Up to 33 characters.
      required: true
      selector:
        text:
    password:
      name: WiFi password
      description: Up to 64 characters.
      required: true
      selector:
        text:
          type: password
    mqtt_server:
      name: MQTT server
      description: >-
        Broker address, with a six-character scheme prefix such as tcp:// which
        the device strips without reading. A hostname works as well as an
        address. Leave empty to change only the WiFi network.
      required: false
      example: tcp://mqtt.example.lan
      selector:
        text:
    aes_key:
      name: AES key
      description: >-
        Base64-encoded, 16 bytes once decoded. Required when an MQTT server is
        given: both travel in the same frame.
      required: false
      selector:
        text:
    aes_iv:
      name: AES initialisation vector
      description: 16 characters, sent as raw text rather than decoded.
      required: false
      selector:
        text:
