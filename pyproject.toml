[project]
name = "htram"
version = "0.1.0"
description = "Home Assistant integration for the stock Honeywell HTRAM firmware, over BLE and MQTT"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "bleak>=2.1.1",
]

[dependency-groups]
dev = [
    "aiousbwatcher>=1.1.2",
    "homeassistant>=2025.4.4",
    "paho-mqtt>=2.1.0",
    "pytest-homeassistant-custom-component==0.13.357",
    "serialx>=1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The integration is imported as `custom_components.htram`, and nothing else
# puts the repository root on sys.path: there is no build-system table, so uv
# never installs this project into the venv. Without this, `uv run pytest`
# fails at collection while `python -m pytest` works, purely because the
# latter adds the working directory.
pythonpath = ["."]
# pytest-homeassistant-custom-component ships autouse async fixtures, which
# pytest-asyncio only handles in auto mode.
asyncio_mode = "auto"
